<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Image Gallery</h1>
    <p>Click any image to view it larger.</p>
  </header>

  <main class="gallery" id="gallery">
    <!-- Replace src and alt with your own images and descriptions -->
    <img src="https://picsum.photos/seed/gallery1/800/600" alt="Gallery photo 1" />
    <img src="https://picsum.photos/seed/gallery2/800/600" alt="Gallery photo 2" />
    <img src="https://picsum.photos/seed/gallery3/800/600" alt="Gallery photo 3" />
    <img src="https://picsum.photos/seed/gallery4/800/600" alt="Gallery photo 4" />
    <img src="https://picsum.photos/seed/gallery5/800/600" alt="Gallery photo 5" />
    <img src="https://picsum.photos/seed/gallery6/800/600" alt="Gallery photo 6" />
    <img src="https://picsum.photos/seed/gallery7/800/600" alt="Gallery photo 7" />
    <img src="https://picsum.photos/seed/gallery8/800/600" alt="Gallery photo 8" />
  </main>

  <!-- Lightbox (hidden until an image is clicked) -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close-btn" id="closeBtn" aria-label="Close preview">&times;</button>
    <img id="lightboxImg" src="" alt="" />
    <p id="caption"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
